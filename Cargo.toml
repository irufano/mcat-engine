[package]
name    = "mcat-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
# Linear algebra (FIM, matrix ops)
nalgebra  = "0.33"

# Serialization (debug/summary payloads, playground I/O types)
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Random (Sympson-Hetter exposure gate, playground response simulation)
rand      = "0.8"

# Error handling
thiserror = "1"

# Prototype/reference examples predating (and cross-checked against) the
# production engine above — see examples/overview.md.
[[example]]
name = "item_selection_d_optimal"
path = "examples/item_selection/d_optimal/item_selection_d_optimal.rs"

[[example]]
name = "item_selection_a_optimal"
path = "examples/item_selection/a_optimal/item_selection_a_optimal.rs"

[[example]]
name = "item_selection_kl_information"
path = "examples/item_selection/kl_information/item_selection_kl_information.rs"

[[example]]
name = "estimation_mle"
path = "examples/estimation/mle/estimation_mle.rs"

[[example]]
name = "estimation_map"
path = "examples/estimation/map/estimation_map.rs"

[[example]]
name = "estimation_eap"
path = "examples/estimation/eap/estimation_eap.rs"
